name: Build PhotoHub APK
on: push

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 1. Pull down a guaranteed stable Python 3.11 runtime
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. Install base system dependencies
      - name: Install Buildozer Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      # 3. CRUCIAL FIX: Hijack the global system paths so 'python3' and 'python' mean 3.11 everywhere
      - name: Force Global Python 3.11 Symlinks
        run: |
          sudo ln -sf $(which python3.11) /usr/local/bin/python3
          sudo ln -sf $(which python3.11) /usr/local/bin/python
          sudo ln -sf $(which python3.11) /usr/bin/python3
          python3 --version # This will now proudly verify as 3.11.x globally

      # 4. Install dependencies and safely trigger the compile pipeline
      - name: Compile APK with Buildozer
        run: |
          pip install --upgrade pip setuptools wheel virtualenv "cython>=3.0.0,<3.1.0" buildozer
          
          # Wipe any residual configuration corruption out of the directory
          rm -rf .buildozer/
          rm -rf ~/.buildozer/
          
          # Execute compilation
          export BUILDOZER_WARN_ON_ROOT=0
          buildozer android debug

      # 5. Export and upload your completed app asset
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoHub-Android-APK
          path: bin/*.apk
