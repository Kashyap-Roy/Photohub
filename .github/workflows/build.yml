name: Build PhotoHub APK
on: push

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip setuptools wheel virtualenv "cython>=3.0.0,<3.1.0" buildozer

      # NEW: Deep clean step to prevent ghost cache errors on the runner
      - name: Clear Dist Cache
        run: |
          mkdir -p ~/.buildozer/android/platform/
          export BUILDOZER_WARN_ON_ROOT=0
          buildozer android clean || true

      - name: Compile APK with Buildozer
        run: |
          export BUILDOZER_WARN_ON_ROOT=0 
          buildozer android debug
