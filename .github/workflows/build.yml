name: Build PhotoHub APK
on: push

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip setuptools wheel virtualenv "cython>=3.0.0,<3.1.0" buildozer

      # FIXED: Added a hard system remove command to wipe out the hidden Python 3.14 directory structures completely
      - name: Deep Purge Old Cache
        run: |
          rm -rf .buildozer/
          rm -rf ~/.buildozer/
          mkdir -p ~/.buildozer/android/platform/

      - name: Compile APK with Buildozer
        run: |
          export BUILDOZER_WARN_ON_ROOT=0 
          python -m buildozer android debug
